[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "femsim"
version = "0.1.0"
description = "Simulador de elementos finitos: calor, especies, flujo de fluidos no newtonianos, viscoelasticidad e inyeccion de polimeros"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "matplotlib>=3.9",
    "jax>=0.4.30",
    "pypardiso>=0.4.6",
]

[project.scripts]
femsim = "Source.cli:main"

[project.optional-dependencies]
amg = ["pyamg>=5.0"]
mesh = ["gmsh>=4.12"]
view = ["pyvista>=0.43"]
all = ["pyamg>=5.0", "gmsh>=4.12", "pyvista>=0.43"]

[tool.setuptools.packages.find]
include = ["Source*", "femsim*"]

[tool.setuptools.package-data]
Source = ["data/materials/*.json"]
